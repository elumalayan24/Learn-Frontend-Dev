<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mobile.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Management</title>
</head>
<body>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="SubscriptionManagement.html" class="active">Subscription Management</a></li>
            <li><a href="AccountSettings.html">Account Settings</a></li>
        </ul>
    </nav>

    <main>
        <h1>Subscription Management</h1>
        <p>Manage your subscriptions here. You can view your current subscriptions, update payment methods, and cancel or renew subscriptions.</p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Plan</th>
                        <th scope="col">Price</th>
                        <th scope="col">Storage</th>
                        <th scope="col">Users</th>
                        <th scope="col">Support</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Basic</th>
                        <td>$9.99/month</td>
                        <td>10 GB</td>
                        <td>1</td>
                        <td>Email</td>
                        <td><button type="button" class="btn-renew">Renew</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <form action="/update-subscription" method="post" class="update-form">
            <div class="form-row">
                <label for="billing-cycle">Billing cycle</label>
                <select id="billing-cycle" name="billing-cycle">
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                </select>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" name="terms">
                I agree to the terms and conditions
            </label>

            <button type="submit" class="btn-submit">Update Subscription</button>
        </form>
    </main>
</body>
</html>
